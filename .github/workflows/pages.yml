name: Publish WebAR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        env:
          VPS_API_BASE: ${{ vars.VPS_API_BASE }}
        run: |
          mkdir pages
          cp -r dist/assets pages/
          cp dist/visit.html pages/index.html
          cp dist/style.css dist/visit.css pages/
          mkdir pages/js
          cp dist/js/{visit,visit-sequences,public-world,zone-photos,zone-face}.js pages/js/
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const page = readFileSync('pages/index.html', 'utf8');
          const testPage = page
            .replace('<body>', '<body data-zone-test>')
            .replace('aria-label="展區定位測試" hidden', 'aria-label="展區定位測試" aria-busy="true"')
            .replace('開啟相機後，請對準展區。', '正在載入測試功能…')
            .replace('</body>', `<script>
              setTimeout(function () {
                var zones = document.getElementById('zoneTests');
                if (zones.hasAttribute('aria-busy')) {
                  document.getElementById('status').textContent = '測試功能沒有載入，請重新整理，或更新手機瀏覽器後再開啟。';
                }
              }, 8000);
              </script></body>`);
          writeFileSync('pages/test.html', testPage);
          const value = (process.env.VPS_API_BASE || '').trim();
          let endpoint = '';
          if (value) {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || url.hash || url.search) {
              throw new Error('VPS_API_BASE must be a public HTTPS URL without credentials.');
            }
            endpoint = new URL('vps/localize', url.href.replace(/\/?$/, '/')).href;
          }
          writeFileSync('pages/pages-runtime.js',
            'globalThis.WEBAR_PAGES_MODE = true;\n' +
            'globalThis.WEBAR_VPS_ENDPOINT = ' + JSON.stringify(endpoint) + ';\n');
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
