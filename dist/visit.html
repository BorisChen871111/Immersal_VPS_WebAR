<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d171d">
  <title>高鐵探索館｜WebAR</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./visit.css?v=3">
</head>
<body>
  <main class="experience">
    <header><p>高鐵探索館</p><h1>WebAR 展區體驗</h1></header>
    <nav id="zoneTests" aria-label="展區定位測試" hidden>
      <button type="button" data-test-zone="train" aria-pressed="false" disabled>展區 1 · 列車</button>
      <button type="button" data-test-zone="photo" aria-pressed="false" disabled>展區 2 · 拍照</button>
      <button type="button" data-test-zone="face" aria-pressed="false" disabled>展區 3 · 臉部追蹤</button>
      <button type="button" id="loseZone" disabled>模擬失去定位</button>
    </nav>
    <section class="viewer" aria-label="AR 畫面">
      <div id="feed"></div>
      <canvas id="zoneOverlay" aria-hidden="true" hidden></canvas>
      <p id="status" role="status">開啟相機後，請對準展區。</p>
      <output id="faceStatus" role="status" hidden></output>
      <output id="photoCountdown" role="status" hidden></output>
      <div id="photoFlash" aria-hidden="true"></div>
    </section>
    <div class="experience-controls">
      <button class="primary" id="startAr">開啟相機</button>
      <div id="sequenceControls" hidden>
        <p id="sequenceTitle" aria-live="polite"></p>
        <button class="primary" id="nextSequence" disabled>下一頁</button>
      </div>
      <div id="photoControls" hidden>
        <button type="button" id="enableTestCamera" hidden>開啟測試相機</button>
        <button type="button" class="primary" id="takePhoto" disabled>拍照</button>
      </div>
    </div>
  </main>
  <dialog id="photoResult" aria-labelledby="photoHeading">
    <h2 id="photoHeading">照片預覽</h2>
    <img id="capturedPhoto" alt="剛拍下的 WebAR 照片">
    <div class="choices">
      <button type="button" id="closePhoto">關閉</button>
      <a class="primary" id="downloadPhoto" download>儲存照片</a>
    </div>
  </dialog>
  <script src="./pages-runtime.js"></script>
  <script type="module" src="./js/visit.js?v=3"></script>
</body>
</html>
